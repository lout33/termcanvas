name: Release macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-macos-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version tag such as v0.3.12, got: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provide OpenCode test stub
        shell: bash
        run: |
          TEST_BIN="$RUNNER_TEMP/termcanvas-test-bin"
          mkdir -p "$TEST_BIN"
          printf '#!/bin/sh\nexit 0\n' > "$TEST_BIN/opencode"
          chmod +x "$TEST_BIN/opencode"
          echo "$TEST_BIN" >> "$GITHUB_PATH"

      - name: Build and test
        run: |
          npm run build
          npm test

      - name: Package arm64 macOS release
        run: npx electron-builder --mac dmg zip --arm64 --publish never

      - name: Verify release artifacts
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "v$VERSION" != "$RELEASE_TAG" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $VERSION" >&2
            exit 1
          fi

          APP_PATH="$PWD/release/mac-arm64/TermCanvas.app"
          DMG_PATH="$PWD/release/TermCanvas-$VERSION-arm64.dmg"
          ZIP_PATH="$PWD/release/TermCanvas-$VERSION-arm64-mac.zip"
          APP_VERSION="$(defaults read "$APP_PATH/Contents/Info" CFBundleShortVersionString)"

          if [[ "$APP_VERSION" != "$VERSION" ]]; then
            echo "Packaged app version $APP_VERSION does not match $VERSION" >&2
            exit 1
          fi

          test -f "$DMG_PATH"
          test -f "$ZIP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Ensure draft release exists
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi

      - name: Upload release assets
        run: gh release upload "$RELEASE_TAG" "$DMG_PATH" "$ZIP_PATH" --clobber

      - name: Verify and publish release
        shell: bash
        run: |
          ASSET_NAMES="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          DMG_NAME="$(basename "$DMG_PATH")"
          ZIP_NAME="$(basename "$ZIP_PATH")"

          if [[ "$ASSET_NAMES" != *"$DMG_NAME"* || "$ASSET_NAMES" != *"$ZIP_NAME"* ]]; then
            echo "Release assets are incomplete:" >&2
            echo "$ASSET_NAMES" >&2
            exit 1
          fi

          gh release edit "$RELEASE_TAG" --draft=false
